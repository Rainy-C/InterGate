name: CI 编译与测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 & 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 编译（字节码 compileall）
        run: |
          python -m compileall -q -f .
          echo "✅ 字节码编译通过"

      - name: 纯逻辑冒烟测试
        run: python tests/unit_smoke.py

      - name: pytest 单元测试
        run: pytest tests/ -v --tb=short

      - name: 网关 + Web 集成冒烟
        run: python tests/gateway_smoke.py
